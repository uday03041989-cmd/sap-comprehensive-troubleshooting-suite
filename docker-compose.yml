version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: sap-troubleshooting-db
    environment:
      POSTGRES_DB: sap_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: sap-troubleshooting-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sap_support
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: sap-troubleshooting-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
